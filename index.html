<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atendimento Agro Cacau</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  padding:20px;
}

.box{
  background:white;
  padding:30px;
  border-radius:16px;
  width:100%;
  max-width:360px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h2{
  color:#1f7a3d;
  margin-bottom:10px;
  font-size:32px;
}

p{
  color:#666;
  font-size:15px;
  margin-bottom:25px;
}

.phone-wrapper{
  display:flex;
  align-items:center;
  width:100%;
}

.ddd{
  background:#f0f0f0;
  padding:16px;
  border:1px solid #ccc;
  border-right:none;
  border-radius:12px 0 0 12px;
  font-size:20px;
  font-weight:bold;
  color:#333;
}

input{
  flex:1;
  padding:16px;
  font-size:22px;
  border:1px solid #ccc;
  border-radius:0 12px 12px 0;
  outline:none;
}

input:focus{
  border-color:#25D366;
}

button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:#25D366;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  display:none;
  transition:0.2s;
}

button:hover{
  transform:scale(1.01);
  opacity:0.95;
}

</style>
</head>

<body>

<div class="box">

  <h2>Atendimento prioritário</h2>

  <p>
    Informe seu WhatsApp para continuar rapidamente o atendimento.
  </p>

  <div class="phone-wrapper">

    <div class="ddd">
      93
    </div>

    <input
      type="tel"
      id="telefone"
      placeholder="999999999"
      maxlength="9"
      inputmode="numeric"
      autocomplete="off"
    >

  </div>

  <button id="btnContinuar" onclick="continuar()">
    SEGUIR PARA O ATENDIMENTO
  </button>

</div>

<script>

const SUPABASE_URL = "https://pdtjpusxhdnroichwckp.supabase.co";
const SUPABASE_KEY = "sb_publishable_omS12Ik0drT7eXfW8eiLjQ_Mx0oGTis";

const vendedores = [
  "5593992407707",
  "5593991153728",
  "5511915539264"
];

const input = document.getElementById("telefone");
const botao = document.getElementById("btnContinuar");

input.addEventListener("input", function () {

  // REMOVE TUDO QUE NÃO FOR NÚMERO
  this.value = this.value.replace(/\D/g, '');

  // MOSTRA O BOTÃO SOMENTE COM 9 NÚMEROS
  if(this.value.length === 9){
    botao.style.display = "block";
  } else {
    botao.style.display = "none";
  }

});

async function continuar() {

  let telefone = input.value.replace(/\D/g, '');

  if(telefone.length !== 9){
    alert("Digite os 9 números do WhatsApp");
    return;
  }

  telefone = "93" + telefone;

  const params = new URLSearchParams(window.location.search);

  const campanha = params.get("campanha") || "direto";
  const criativo = params.get("criativo") || "sem_criativo";

  let index = localStorage.getItem("vendedorIndex") || -1;

  index = (parseInt(index) + 1) % vendedores.length;

  localStorage.setItem("vendedorIndex", index);

  const vendedor = vendedores[index];

  await fetch(`${SUPABASE_URL}/rest/v1/pistas`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({
      telefone: telefone,
      vendedor: vendedor,
      campanha: campanha,
      criativo: criativo,
      loja: "Loja A"
    })
  });

  const mensagem = encodeURIComponent(
    `Olá, vim do anúncio e gostaria de atendimento.`
  );

  window.location.href =
    `https://wa.me/${vendedor}?text=${mensagem}`;
}

</script>

</body>
</html>
